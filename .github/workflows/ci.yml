name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flixa:
    name: Flixa CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check CLI, build, format, and integration contract (Unix)
        if: matrix.os == 'ubuntu-latest'
        run: bun run check

      - name: Check CLI, build, and integration contract (Windows)
        if: matrix.os == 'windows-latest'
        run: bunx tsc --noEmit && bun run lint && bun run build && bun run openclaw:check

  openclaw:
    name: OpenClaw plugin
    needs: flixa
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install plugin dependencies
        working-directory: integrations/openclaw-flixa
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build plugin
        working-directory: integrations/openclaw-flixa
        run: npm run build

      - name: Smoke-load plugin runtime
        working-directory: integrations/openclaw-flixa
        run: npm run smoke
