name: Publish

on:
  push:
    branches:
      - master
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Read CLI package version
        id: package
        shell: bash
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Install OpenClaw plugin dependencies
        working-directory: integrations/openclaw-flixa
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build OpenClaw plugin
        working-directory: integrations/openclaw-flixa
        env:
          FLIXA_RELEASE_VERSION: ${{ github.ref_type == 'branch' && format('{0}-canary.{1}', steps.package.outputs.version, github.run_number) || steps.package.outputs.version }}
        run: npm run build

      - name: Publish canary
        if: github.ref_type == 'branch'
        run: |
          npm version "${{ steps.package.outputs.version }}-canary.${{ github.run_number }}" --no-git-tag-version
          npm publish --tag canary --access public --provenance

      - name: Publish OpenClaw plugin canary
        if: github.ref_type == 'branch'
        working-directory: integrations/openclaw-flixa
        run: npm publish --tag canary --access public --provenance

      - name: Publish release
        if: github.ref_type == 'tag'
        run: npm publish --access public --provenance

      - name: Publish OpenClaw plugin release
        if: github.ref_type == 'tag'
        working-directory: integrations/openclaw-flixa
        run: npm publish --access public --provenance
